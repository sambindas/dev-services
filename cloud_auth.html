<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dev Services · Sign in</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0e1118;color:#e8ecf5;font:14px/1.6 system-ui,sans-serif}main{width:min(440px,calc(100% - 32px));padding:36px;border:1px solid #272e3d;border-radius:18px;background:#151a24}small{color:#a5b4fc;letter-spacing:.13em;text-transform:uppercase}h1{font-size:28px;letter-spacing:-.04em;margin:8px 0}p{color:#97a1b5}label{display:block;margin:20px 0 6px}input,button{width:100%;padding:12px;font:inherit;border-radius:8px;border:1px solid #35405a}input{background:#0e1118;color:#fff}button{background:#a5b4fc;color:#131a34;font-weight:600;margin-top:24px;cursor:pointer}button.link{background:none;color:#a5b4fc;border:0;padding:0;margin-top:18px}#error{color:#fda4af;min-height:1.6em}input:focus-visible,button:focus-visible{outline:2px solid #a5b4fc;outline-offset:3px}.note{font-size:12px}</style></head>
<body><main><small>Dev Services · Preview</small><h1 id="title">Welcome back.</h1><p>One workspace for your local projects, wherever you open your browser.</p><form id="auth"><label for="username">Username</label><input id="username" name="username" autocomplete="username" pattern="[A-Za-z0-9_-]{3,32}" minlength="3" maxlength="32" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" minlength="12" maxlength="256" required><button id="submit">Sign in</button><div id="error" role="alert"></div></form><button class="link" id="toggle">New here? Create an account</button><p class="note">Requires a local agent on your computer. Keep your password safe: account recovery is not available in this preview.</p></main>
<script>let register=false;document.querySelector('#toggle').onclick=()=>{register=!register;document.querySelector('#title').textContent=register?'Create your workspace.':'Welcome back.';document.querySelector('#submit').textContent=register?'Create account':'Sign in';document.querySelector('#toggle').textContent=register?'Already registered? Sign in':'New here? Create an account';document.querySelector('#password').autocomplete=register?'new-password':'current-password';document.querySelector('#error').textContent=''};document.querySelector('#auth').onsubmit=async e=>{e.preventDefault();const button=document.querySelector('#submit');button.disabled=true;try{const response=await fetch(register?'/api/register':'/api/login',{method:'POST',headers:{'Content-Type':'application/json','X-Dashboard':'1'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const result=await response.json();if(!response.ok)throw Error(result.error);location.assign('/')}catch(error){document.querySelector('#error').textContent=error.message}finally{button.disabled=false}};</script></body></html>
